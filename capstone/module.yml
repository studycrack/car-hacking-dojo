name: Capstone

resources:
  - type: markdown
    name: All of It at Once
    expandable: false
    content: |
      Three modules, three interfaces, and in a real vehicle they are not three
      problems. They are one path: something reachable from outside, bridged to
      something that was never meant to be reachable at all.

      This is the shape of every serious automotive compromise that has been
      published. Nobody attacked a powertrain bus directly. They attacked the
      thing that was talking to it and to the outside world at the same time.

  - id: pivot
    type: challenge
    name: From the Air to the Bus
