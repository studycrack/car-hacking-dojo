<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- A system bus for one container.

     bleak looks for org.bluez on the system bus, so there has to be one, and
     the shim has to be allowed to own that name. The stock system policy only
     lets the bluetooth user own it, which is no use here.

     This container holds one student and a simulated car. The policy is
     therefore open: the bus exists so that two processes inside the same
     workspace can talk, not as a security boundary. -->

<busconfig>
  <type>system</type>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>

  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
    <allow send_type="method_return"/>
    <allow send_type="error"/>
    <allow receive_type="method_call"/>
    <allow receive_type="signal"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>
</busconfig>
