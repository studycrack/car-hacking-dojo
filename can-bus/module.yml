name: The CAN Bus

resources:
  - type: markdown
    name: Controller Area Network
    expandable: false
    content: |
      **CAN**은 두 가닥 전선으로 이루어진 broadcast 버스입니다. frame 하나는
      11비트 *ID*와 최대 8바이트 데이터를 나르고, 프로토콜은 사실상 그게
      전부입니다. ID는 누가 보냈는지도, 누가 받아야 하는지도 말하지 않습니다.
      그 frame이 **무슨 뜻인지**를 말할 뿐이고, 버스에 있는 컨트롤러가 각자
      자기와 상관있는지 판단합니다.

      확인할 발신 주소가 없으니 인증할 대상도 없습니다. 이 모듈의 모든 공격이
      그 사실 하나에서 나옵니다.

      워크스페이스에는 달리는 자동차가 연결된 `vcan0`과 표준 리눅스 CAN 도구가
      있습니다. 들을 때는 `candump`, 보낼 때는 `cansend`입니다.

  - type: header
    content: 버스 읽기

