name: The CAN Bus

resources:
  - type: markdown
    name: Controller Area Network
    expandable: false
    content: |
      **CAN** is a two-wire broadcast bus. A frame carries an 11-bit
      *identifier* and up to 8 bytes of data, and that is very nearly the whole
      protocol. The identifier does not say who sent the frame or who should
      receive it --- it says what the frame *means*, and every controller on the
      bus decides for itself whether it cares.

      There is no source address to check, so there is nothing to authenticate
      against. Every attack in this module follows from that one fact.

      Your workspace has a CAN interface named `vcan0` attached to a running
      vehicle, and the standard Linux CAN tooling to work with it: `candump` to
      listen, `cansend` to transmit.

  - id: sniffing
    type: challenge
    name: Listening to the Bus

  - id: filtering
    type: challenge
    name: Finding the Signal

  - id: injection
    type: challenge
    name: Forging Frames

  - id: spoofing
    type: challenge
    name: Reversing the Layout
