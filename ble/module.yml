name: Bluetooth and the Phone

resources:
  - type: markdown
    name: The Wireless Half of the Attack Surface
    expandable: false
    content: |
      Everything you have attacked so far needed you to be inside the car with
      a connector in your hand. The interesting attacks are the ones that do
      not.

      A car built in the last decade is covered in **Bluetooth Low Energy**.
      The phone that unlocks it is a BLE peripheral. So are the tyre pressure
      sensors, the aftermarket dongle somebody left in the OBD-II port, and
      whatever the workshop paired to it and forgot about. All of it answers
      from outside the vehicle, to anyone with a radio.

      BLE's data model is **GATT**: a flat table of *attributes*, each with a
      16-bit *handle* and a *UUID* saying what it is. Characteristics hold
      values, descriptors annotate them, and the protocol that reads and writes
      them is **ATT** --- a handful of request/response opcodes and nothing
      else. There is no session, no authentication by default, and nothing
      stopping you enumerating the whole table.

      Your workspace has the standard Linux Bluetooth tooling: `hcitool` to
      scan for what is advertising, `gatttool` to connect and talk to it, and
      `hcidump` to watch the air itself. Use `gatttool --listen` to stay
      connected once you have subscribed to something.

      `bluetoothctl`, the BlueZ shell you would use on a real machine, is here
      too and works the same way: `scan on`, then `connect`, then its `gatt`
      menu.

      Those cover most of what follows but not all of it. A shell command that
      exits after one reply is an awkward way to hold a subscription open while
      you poke the peripheral with something else, or to queue a write across
      several packets --- and for a couple of these challenges it is not
      awkward but impossible. The stack the tools are built on is importable,
      and `/challenge/ble.py` is worth reading:

          import sys
          sys.path.insert(0, "/challenge")
          import ble

          client = ble.Client("aa:bb:cc:dd:ee:ff")
          client.read(handle)
          client.write(handle, b"\x01")
          client.write_long(handle, value)      # more than one packet holds
          client.subscribe(cccd_handle)         # then wait for what it pushes
          for handle, value in client.events_stream(timeout=5):
              print(hex(handle), value)

      If you would rather use the library you would use against a real
      peripheral, `bleak` is installed and works here --- these workspaces
      answer on D-Bus as `org.bluez` the way a genuine controller would:

          import asyncio
          from bleak import BleakClient, BleakScanner

          async def main():
              for device in await BleakScanner.discover():
                  print(device.address, device.name)

          asyncio.run(main())

